[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialx"
version = "0.3.0"
description = "Camera-based 3D human spatial interaction platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SpatialX Engineering" }]
dependencies = [
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.14",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
spatialx = "spatialx.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
